name: Deploy to Netlify

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    name: 🚀 Deploy KESMA NEWS
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🌐 Deploy and Publish to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          echo "Deploying files to Netlify..."
          DEPLOY_OUTPUT=$(npx --yes netlify-cli deploy --dir="." --json --auth="$NETLIFY_AUTH_TOKEN" --site="$NETLIFY_SITE_ID")
          DEPLOY_ID=$(echo "$DEPLOY_OUTPUT" | jq -r '.deploy_id')
          echo "Deployed with ID: $DEPLOY_ID"
          
          echo "Promoting deploy to production..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
            "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID/deploys/$DEPLOY_ID/restore")
          echo "Promotion status code: $STATUS"
          
          if [ "$STATUS" -ne 200 ]; then
            echo "❌ Failed to promote deploy to production"
            exit 1
          fi
          echo "✅ Successfully deployed and published to Netlify production!"
